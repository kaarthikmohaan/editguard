[project]
name = "editguard"
version = "0.1.0"
description = "Real-time triage of Wikipedia edits that anti-vandal bots miss"
readme = "README.md"
authors = [
    { name = "Karthik Mohan", email = "158012573+kaarthikmohaan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.15.1",
    "duckdb>=1.5,<1.6",
    "fastavro>=1.12.2",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic-settings>=2.15.0",
    "pyspark==4.1.3",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
transform = [
    "dbt-athena==1.11.1",
    "dbt-core>=1.12.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
