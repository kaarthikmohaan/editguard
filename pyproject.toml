[project]
name = "editguard"
version = "0.1.0"
description = "Real-time triage of Wikipedia edits that anti-vandal bots miss"
readme = "README.md"
authors = [
    { name = "Karthik Mohan", email = "158012573+kaarthikmohaan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.15.1",
    "duckdb>=1.5,<1.6",
    "fastavro>=1.12.2",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic-settings>=2.15.0",
    "pyspark==4.2.0",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "pyyaml>=6",
    "ruff>=0.16.9",
    "testcontainers[kafka]>=4.15",
]
transform = [
    "dbt-athena==1.11.1",
    "dbt-core>=1.12.5",
    "dbt-duckdb==1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test layers (docs/testing.md). Every test is `unit` unless its module sets another layer
# (tests/conftest.py). `make test` runs unit only; `make test-all` runs every local layer.
markers = [
    "unit: fast, no network, no JVM (the default layer)",
    "dbt: compiles the dbt project in-process (offline, a few seconds each)",
    "spark: starts a local Spark session (needs Java 17 and the connector jars)",
    "integration: starts Kafka and Schema Registry in Docker (testcontainers)",
    "e2e: needs AWS (staging)",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/editguard"]
branch = true

[tool.coverage.report]
skip_empty = true
