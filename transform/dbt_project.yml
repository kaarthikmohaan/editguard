# EditGuard batch layer: bronze -> silver -> gold on Athena (design section 7, ADR 0003).
# Run through make: make dbt ENV=staging|prod CMD="build"
name: editguard
version: "0.1.0"
profile: editguard
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

models:
  editguard:
    # Every table is Iceberg on Glue. Athena always creates format v2 (ADR 0008); it rejects
    # a format-version property, so v2 is checked on the table metadata instead.
    +table_type: iceberg
    +format: parquet
    silver:
      +schema: silver
    gold:
      +schema: gold
