# One target per environment (design: stg_* and prod_* databases, one Athena workgroup each).
# DATA_BUCKET contains the account ID, so it comes from the environment (the make target sets it).
editguard:
  target: staging
  outputs:
    staging:
      type: athena
      region_name: ap-south-1
      database: awsdatacatalog
      schema: stg_silver
      work_group: editguard-stg
      s3_staging_dir: "s3://{{ env_var('DATA_BUCKET') }}/athena-results/stg/"
      s3_data_dir: "s3://{{ env_var('DATA_BUCKET') }}/stg/"
      s3_data_naming: schema_table
      aws_profile_name: "{{ env_var('AWS_PROFILE', 'editguard-dev') }}"
      threads: 2
    prod:
      type: athena
      region_name: ap-south-1
      database: awsdatacatalog
      schema: prod_silver
      work_group: editguard-prod
      s3_staging_dir: "s3://{{ env_var('DATA_BUCKET') }}/athena-results/prod/"
      s3_data_dir: "s3://{{ env_var('DATA_BUCKET') }}/prod/"
      s3_data_naming: schema_table
      aws_profile_name: "{{ env_var('AWS_PROFILE', 'editguard-dev') }}"
      threads: 2
