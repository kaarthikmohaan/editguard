version: 2

models:
  - name: edits
    description: >
      Deduplicated article edits from bronze.edits (bronze.edits_replay joins in the replay
      step). Same fields as bronze except user_hash replaces the username and raw_json is
      dropped. See docs/data-dictionary.md.
    columns:
      - name: event_id
        description: Primary key. The zero-duplicate check for M2.
        data_tests: [unique, not_null]
      - name: event_time
        data_tests: [not_null]
      - name: wiki_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [enwiki, hiwiki, bnwiki, tawiki, tewiki, mlwiki, knwiki, mrwiki]
      - name: namespace_id
        data_tests:
          - accepted_values:
              arguments:
                values: [0]
                quote: false
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [live, replay]
      - name: user_hash
        description: Salted SHA-256 of performer_user_text; 64 hex characters.

  - name: baseline_scores
    description: >
      Wikimedia revert-risk score per article edit, one row per (wiki_id, rev_id), from
      bronze.baseline_scores (ADR 0011). event_time is the edit's, from silver.edits.
    columns:
      - name: wiki_id
        data_tests: [not_null]
      - name: rev_id
        data_tests: [not_null]
      - name: event_time
        data_tests: [not_null]
      - name: probability_true
        data_tests: [not_null]

  - name: labels
    description: >
      One label per article edit from later reverts on the same page (ADR 0005): damaging,
      bot_caught, ok, or label_unknown while younger than 48 hours. Frozen at label_final_at.
      See docs/data-dictionary.md.
    columns:
      - name: wiki_id
        data_tests: [not_null]
      - name: rev_id
        data_tests: [not_null]
      - name: label
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [damaging, bot_caught, ok, label_unknown]

  - name: user_history_asof_hour
    description: >
      Each editor's edits and reverts received in the 720 hours ending with asof_hour, as known
      at the end of that hour. Sparse: one row per hour in which a count changes; an edit at
      hour H reads the latest row at or before H - 1. See docs/data-dictionary.md.
    columns:
      - name: user_hash
        data_tests: [not_null]
      - name: asof_hour
        data_tests: [not_null]
      - name: edits_30d
        data_tests: [not_null]
      - name: reverts_received_30d
        data_tests: [not_null]
