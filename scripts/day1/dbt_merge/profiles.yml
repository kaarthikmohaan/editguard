# The bucket name contains the account ID, so it comes from the environment (see run.sh).
day1_merge:
  target: staging
  outputs:
    staging:
      type: athena
      region_name: ap-south-1
      database: awsdatacatalog
      schema: stg_silver
      work_group: editguard-stg
      s3_staging_dir: "s3://{{ env_var('EDITGUARD_DATA_BUCKET') }}/athena-results/stg/"
      s3_data_dir: "s3://{{ env_var('EDITGUARD_DATA_BUCKET') }}/stg/silver/"
      s3_data_naming: table
      aws_profile_name: "{{ env_var('AWS_PROFILE', 'editguard-dev') }}"
      threads: 1
