# CI: every pull request and every push to main (docs/testing.md, section 1).
# No AWS here: dbt runs on DuckDB and the pipeline test on throwaway Docker containers.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to exact releases (some, like setup-uv, publish no moving major tag);
# Dependabot proposes updates weekly.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"  # install exactly uv.lock; fail if pyproject.toml and the lock disagree
  CONTACT_EMAIL: ci@example.com  # required by Settings; never used to contact anyone in CI

jobs:
  lint:
    name: lint and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: gitleaks (same version as the pre-commit hook)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --all-groups
      - run: uv run pytest -m unit --cov --cov-report=term-missing:skip-covered

  contract:
    name: data contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --all-groups
      - run: make contract-check

  dbt:
    name: dbt on DuckDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --all-groups
      - run: make dbt-ci
      - run: uv run pytest -m dbt

  pipeline:
    name: Spark and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: cache Spark's connector jars (Ivy)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('src/editguard/streaming/live_job.py') }}
      - run: uv sync --all-groups
      - run: uv run pytest -m "spark or integration"

  images:
    name: container images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: build the producer and Spark images
        run: |
          docker build --target producer -t editguard-producer:ci .
          docker build --target spark -t editguard-spark:ci .
      - name: images can load their contract schemas and start
        run: |
          docker run --rm --entrypoint python editguard-producer:ci -c \
            "from editguard.producer.streams import STREAMS; [s.schema_path.read_text() for s in STREAMS.values()]"
          docker run --rm editguard-producer:ci --help
          docker run --rm editguard-spark:ci --help

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv export --all-groups --no-hashes --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --progress-spinner off
