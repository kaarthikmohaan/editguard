name: editguard

x-kafka: &kafka
  image: apache/kafka:4.3.1
  restart: unless-stopped
  mem_limit: 1g
  environment: &kafka-env
    CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["kafka-1:/var/lib/kafka/data"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://127.0.0.1:9092

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["127.0.0.1:9094:9094"]
    volumes: ["kafka-2:/var/lib/kafka/data"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://127.0.0.1:9094

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["127.0.0.1:9096:9096"]
    volumes: ["kafka-3:/var/lib/kafka/data"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://127.0.0.1:9096

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.0
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      kafka-1: {condition: service_healthy, restart: true}
      kafka-2: {condition: service_healthy, restart: true}
      kafka-3: {condition: service_healthy, restart: true}
    ports: ["127.0.0.1:8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    mem_limit: 512m
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    environment:
      POSTGRES_DB: editguard
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d editguard"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  postgres:
